[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "free-search-api"
version = "1.0.0"
description = "Self-hosted, keyless, unlimited web search API — drop-in for Tavily, Serper, Brave Search API & SearXNG. MCP server included."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ethos6" }]
keywords = ["search", "search-api", "web-search", "serp", "tavily", "serper", "searxng", "mcp", "llm", "rag", "ai-agents", "duckduckgo", "brave", "bing", "metasearch", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "curl_cffi>=0.10",
  "lxml>=5.0",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
redis = ["redis>=5.0"]
all = ["mcp>=1.10", "redis>=5.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mcp>=1.10"]

[project.scripts]
freesearch = "freesearch.cli:main"

[project.urls]
Homepage = "https://github.com/Ethos6/free-search-api"
Issues = "https://github.com/Ethos6/free-search-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["freesearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real search engines (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
