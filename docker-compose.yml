services:
  freesearch:
    build: .
    # image: ghcr.io/ethos6/free-search-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FREESEARCH_REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped

  # Optional: route traffic through Tor for extra IP diversity.
  # Uncomment, then set FREESEARCH_PROXIES=socks5h://tor:9050 in .env
  # tor:
  #   image: dperson/torproxy
  #   restart: unless-stopped
