name: Demo GIF

# Records docs/demo.gif from the real web UI against live sources, then
# proposes it as a pull request. Run it from the Actions tab whenever the UI changes.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e .
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start server
        run: |
          nohup freesearch serve --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          sleep 15
      - name: Record demo (fails if the page shows no real results)
        run: python scripts/record_demo.py --url http://127.0.0.1:8000 --out docs/demo.gif
      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: demo-debug
          path: |
            demo-failure.png
            server.log
      - name: Open a pull request with the new GIF
        # main is protected, so the GIF is proposed as a pull request.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git diff --cached --quiet && echo "no change" && exit 0
          branch="demo-gif/${{ github.run_id }}"
          git switch -c "$branch"
          git commit -m "Update demo GIF"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Update demo GIF" \
            --body "Recorded by the Demo GIF workflow (run ${{ github.run_id }})."
